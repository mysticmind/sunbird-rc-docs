# Build the docs and publish them to GitHub Pages on every push to main.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
#
# In the Sunbird-RC organisation the site is served at rc.sunbird.org (root path, with public/CNAME).
# Anywhere else (a personal demo or a fork) it is served at https://<owner>.github.io/<repo>/, and the
# CNAME file is left out so the copy never claims rc.sunbird.org.
name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OFFICIAL: ${{ github.repository_owner == 'Sunbird-RC' }}
      DOCS_BASE: ${{ github.repository_owner == 'Sunbird-RC' && '/' || format('/{0}/', github.event.repository.name) }}
      DOCS_SITE: ${{ github.repository_owner == 'Sunbird-RC' && 'https://rc.sunbird.org' || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, for the "Last updated" dates on each page
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Leave out CNAME outside the Sunbird-RC organisation
        if: env.OFFICIAL != 'true'
        run: rm -f .vitepress/dist/CNAME
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
